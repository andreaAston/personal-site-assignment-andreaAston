    <main id="main">
    <section class="contact-hero" aria-labelledby="contact-heading">
        <div class="hero__overlay" aria-hidden="true"></div>

        <div class="contact-hero__inner">
        <h1 class="contact-hero__title" id="contact-heading">Contact Me</h1>
        <p class="contact-hero__subtitle">
            Have a project in mind or want to collaborate? I'd love to hear
            from you.
        </p>

        <h2 class="contact-hero__lets-talk">Let's Talk</h2>

        <form class="contact-form" id="contact-form" novalidate>
            <div class="form-row">
            <div class="form-field">
                <label for="first-name">First name</label>
                <input
                type="text"
                id="first-name"
                name="first-name"
                placeholder="Jane"
                autocomplete="given-name"
                required
                aria-describedby="first-name-error"
                />
                <span class="form-error" id="first-name-error" role="alert"></span>
            </div>

            <div class="form-field">
                <label for="last-name">Last name</label>
                <input
                type="text"
                id="last-name"
                name="last-name"
                placeholder="Smitherton"
                autocomplete="family-name"
                required
                aria-describedby="last-name-error"
                />
                <span class="form-error" id="last-name-error" role="alert"></span>
            </div>
            </div>

            <div class="form-field">
            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="email@janesfakedomain.net"
                autocomplete="email"
                required
                aria-describedby="email-error"
            />
            <span class="form-error" id="email-error" role="alert"></span>
            </div>

            <div class="form-field">
            <label for="subject">Subject</label>
            <input
              type="text"
              id="subject"
              name="subject"
              placeholder="Project enquiry"
              required
              aria-describedby="subject-error"
            />
            <span class="form-error" id="subject-error" role="alert"></span>
            </div>

            <div class="form-field">
            <label for="message">Your message</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                placeholder="Enter your question or message"
                required
                aria-describedby="message-error"
            ></textarea>
            <span class="form-error" id="message-error" role="alert"></span>
            </div>

            <button type="submit" class="btn btn--card">Submit</button>

            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
        </div>
    </section>
    </main>
